# Everything that changes with Minecraft lives in versions/<band>.properties, picked with -Pmc,
# and is deliberately NOT here, so a stale value can never shadow it. See settings.gradle.
# Every field used in a metadata file must also be in the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
version=1.5.1
group=com.chillpavz.dynamicnutrition
java_version=21

# Common
mod_name=Dynamic Nutrition
mod_author=chillpavz
mod_id=dynamicnutrition
license=PolyForm-Shield-1.0.0
credits=
description=Tracks five nutrients from everything you eat, with values modelled on real nutritional data. Eat a balanced diet and you are rewarded; ignore it and you are not.

# NEVER pin the neoforge or forge dependency to a build number. Both sort as <mc>.<build>, so a pin
# refuses every earlier build of the same Minecraft version. Range on the Minecraft line instead.
# Fabric cannot parse Maven bracket ranges, so each band spells its range twice.
neoforge_loader_version_range=[4,)

# Cloth Config is a REQUIRED dependency on all three loaders in both 1.21.x bands: requiring it
# means the config screen is always present. Mod Menu stays optional; it only supplies the Fabric
# button that opens the screen.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
