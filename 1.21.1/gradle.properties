# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.5.1
group=com.chillpavz.dynamicnutrition
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Dynamic Nutrition
mod_author=chillpavz
mod_id=dynamicnutrition
license=PolyForm-Shield-1.0.0
credits=
description=Tracks five nutrients from everything you eat, with values modelled on real nutritional data. Eat a balanced diet and you are rewarded; ignore it and you are not.

# Version ranges.
# NEVER pin the neoforge or forge dependency to a build number. Both sort as <mc>.<build>, so a pin
# refuses every earlier build of the same Minecraft version. Range on the Minecraft line instead.
# Fabric cannot parse Maven bracket ranges, so the same range has to be spelled twice.
minecraft_version_range=[1.21, 1.21.2)
fabric_minecraft_version_range=>=1.21 <1.21.2

## This is the version of minecraft that the 'common' project uses, you can find a list of all
## versions here https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.80
neoforge_version_range=[21.0, 21.2)
neoforge_loader_version_range=[4,)

# Forge, see https://files.minecraftforge.net/
forge_version=52.0.28
forge_version_range=[51,53)
forge_loader_version_range=[51,)

# Config. On this branch Cloth Config is a REQUIRED dependency on all three loaders: unlike the
# 26.x band there is no day-zero race to win here, and requiring it means the config screen is
# always present. Forge uses official Cloth Config's Forge build, which still exists at this version.
# Mod Menu stays optional; it only supplies the Fabric button that opens the screen.
cloth_config_version=15.0.140
modmenu_version=11.0.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
