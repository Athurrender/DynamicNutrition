# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.5.1
group=com.chillpavz.dynamicnutrition
java_version=25

# Common
minecraft_version=26.2
mod_name=Dynamic Nutrition
mod_author=chillpavz
mod_id=dynamicnutrition
license=PolyForm-Shield-1.0.0
credits=
description=Tracks five nutrients from everything you eat, with values modelled on real nutritional data. Eat a balanced diet and you are rewarded; ignore it and you are not.

# The BAND this jar supports, used for the folder, the jar name and the store listings. It is not
# the version anything compiles against: that is minecraft_version below, and it stays concrete.
# 26.x rather than 26.2 because the jar covers more than one whole line, which tools/
# check_version_span.py verifies member by member rather than assuming.
version_band=26.x

# Version ranges.
# NEVER pin the neoforge dependency to a build number. NeoForge builds sort as <mc>.<build>, so a
# pin refuses every earlier build of the same Minecraft version, and on release day only a -beta
# exists. Range on the Minecraft line instead. Fabric cannot parse Maven bracket ranges, so the
# same range has to be spelled twice.
minecraft_version_range=[26.1,26.4)
fabric_minecraft_version_range=>=26.1 <26.4
neoforge_version_range=[26.1,26.4)

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.159.0+26.2
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.76
neoforge_loader_version_range=[4,)

# This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Optional dependencies. Cloth supplies the config screen on both loaders; Mod Menu supplies the
# Fabric button that opens it. Both are OPTIONAL by design: cloth is the only dependency that is not
# ready on the day a new Minecraft version ships (it runs 1 to 3 days behind), and a required
# dependency would mean not being able to update on day zero.
cloth_config_version=26.2.155
modmenu_version=20.0.1

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
