modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/ChillPavz/DynamicNutrition/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://modrinth.com/mod/dynamicnutrition"
# Both keys, because the band spans the change: 26.1 reads only logoFile, and 26.2 onwards reads
# iconFile and warns about a mod that declares logoFile without it.
logoFile = "${mod_id}.png"
iconFile = "${mod_id}.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

# The NeoForge dependency is ranged on the MINECRAFT line, never pinned to a build number.
# NeoForge versions sort as <mc>.<build>, so "[26.2.0.76,)" would refuse every earlier 26.2 build,
# and on the day a new Minecraft version ships the only build that exists is a -beta.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Cloth supplies the config screen and is REQUIRED on this band, unlike the 26.x one where it is
# optional so the mod can update on the day a new Minecraft version ships without waiting the one
# to three days cloth runs behind. There is no such race on a version this old. Note the id differs
# per loader: the Fabric build is "cloth-config" and provides "cloth-config2", the NeoForge and
# Forge builds are "cloth_config".
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
