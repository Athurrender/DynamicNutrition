# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.5.1
group=com.chillpavz.dynamicnutrition
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Dynamic Nutrition
mod_author=chillpavz
mod_id=dynamicnutrition
license=PolyForm-Shield-1.0.0
credits=
description=Tracks five nutrients from everything you eat, with values modelled on real nutritional data. Eat a balanced diet and you are rewarded; ignore it and you are not.

# Version ranges.
# NEVER pin the forge dependency to a build number. It sorts as <mc>.<build>, so a pin refuses every
# earlier build of the same Minecraft version. Range on the Minecraft line instead.
# Fabric cannot parse Maven bracket ranges, so the same range has to be spelled twice.
minecraft_version_range=[1.20, 1.20.2)
fabric_minecraft_version_range=>=1.20 <1.20.2
# The jar names carry this rather than the compile target alone.
minecraft_version_label=1.20.1

parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.2+1.20.1
fabric_loader_version=0.16.9

# Forge. THIS JAR IS ALSO THE NEOFORGE JAR: NeoForge 47.1.x provides the `forge` mod id, so there is
# no neoforge module on this branch.
forge_version=47.2.30
forge_version_range=[46,48)
forge_loader_version_range=[46,)

# Config. On THIS branch Cloth Config is OPTIONAL (owner's decision, 23 Sept 2026), unlike the other
# backport branches. Cloth publishes no neoforge-tagged file at 1.20.x, and this Forge jar is also
# the NeoForge jar, so a NeoForge player's launcher would never offer it. Without cloth the mod runs
# on its defaults and there is no config screen.
cloth_config_version=11.1.136
mod_menu_version=7.2.2

pack_format=15

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
