pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// ONE FOLDER, TWO BUILDS. -Pmc picks a file in versions/: everything that changes with Minecraft
// (versions, ranges, the Forge Cloth artifact, which era source folders are compiled) lives
// there and nowhere else, so no stale value can shadow it.
//   ./gradlew build -Pmc=1.21.1     Fabric, NeoForge and Forge on 1.21 and 1.21.1
//   ./gradlew build -Pmc=1.21.11    Fabric, NeoForge and Forge on 1.21.11
// tools/build_all.py runs both, then audits each.
def band = providers.gradleProperty('mc').getOrElse('1.21.11')
def bandFile = file("versions/${band}.properties")
if (!bandFile.exists()) {
    def known = file('versions').list().findAll { it.endsWith('.properties') }.collect { it - '.properties' }.sort()
    throw new GradleException("Unknown Minecraft band '${band}' (-Pmc). Known: ${known.join(', ')}")
}
def bandProps = new Properties()
bandFile.withInputStream { bandProps.load(it) }
gradle.beforeProject { p ->
    bandProps.each { key, value -> p.ext.set(key as String, value) }
}
logger.lifecycle("Dynamic Nutrition, Minecraft band ${band} (${bandProps.minecraft_version}; eras ${bandProps.eras})")

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'dynamicnutrition'
include('common')
include('fabric')
include('neoforge')
include('forge')