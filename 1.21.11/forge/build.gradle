plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'idea'
}
base {
    // The template used mod_name here, which puts spaces in the jar filename; mod_id matches what
    // multiloader-common gives the other modules.
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

// Two mixins, both client only, both the direct analogue of the Fabric ones. NeoForge needs none:
// it has a client extension per mob effect for exactly this, and Forge's equivalent is only
// reachable by overriding initializeClient on the effect class, which lives in common and so
// cannot name anything loader specific.
mixin {
    config("${mod_id}.forge.mixins.json")
}
jar {
    manifest {
        attributes["MixinConfigs"] = "${mod_id}.forge.mixins.json"
    }
}
processResources {
    // common/ ships META-INF/accesstransformer.cfg and this module has none of its own, so the
    // common copy simply travels. That is safe here: at compile time Forge is SRG named but this
    // module needs no widening at all (Forge patches public getGuiLeft/getGuiTop onto
    // AbstractContainerScreen, which is what the other two loaders widen leftPos/topPos for), and
    // at runtime Forge is official named from 1.20.6 on, which is the spelling that file uses.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// sourcesJar pulls in common's resources as well, so it hits the same clash. Nothing reads an AT
// out of a sources jar, so first-wins is fine here and needs no assertion.
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // No forge access transformer: this module needs no widening. Forge patches public
    // getGuiLeft()/getGuiTop() onto AbstractContainerScreen, so the two fields Fabric and NeoForge
    // have to widen are already reachable here. If one is ever needed it must be SRG named, because
    // Forge is still SRG named at compile time, and so cannot be the common file.

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    // Cloth Config's Forge build for this Minecraft version is the unofficial cloth-config-forge
    // port, which is published on Modrinth rather than on shedaniel's maven (official cloth stops
    // shipping Forge builds after 1.21.3). Same mod id, 'cloth_config', and the same version number.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // "Cloth Config API Forge" (addavriance). Published on Modrinth, not shedaniel's maven, because
    // it is his own Forge module re-enabled by someone else. REQUIRED on this band, same as the
    // other two loaders.
    // No fg.deobf: this module compiles against official mappings (mappings channel 'official',
    // reobf = false above), and Forge has shipped official names since 1.20.6, so the published jar
    // already matches. fg.deobf instead asks for a "..._mapped_official_1.21.11" artifact that
    // nobody publishes, and fails to resolve.
    implementation("maven.modrinth:cloth-config-forge:${cloth_config_version}")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
